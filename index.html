<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Digital Performance — Intelligence Platform. Demo environment with synthetic data." />
    <title>Digital Performance · Intelligence Platform</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('dp.settings') || '{}');
        var mode = s.theme || 'light';
        if (mode === 'system') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = mode;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
