:root,

  --bg-card: var(--vds-white);
  --bg-card2: var(--vds-grey-01);

  --accent: var(--vds-red);

html { font-family: var(--font-sans); background: var(--bg-app); }
body {

.mono { font-family: var(--font-sans); }

input:not([type='checkbox']):not([type='radio']),
select,
textarea,
button { font-family: var(--font-sans); }
input:not([type='checkbox']):not([type='radio']),
select { border-radius: var(--radius-md) !important; }

@keyframes dp-shimmer { 0%,100%{opacity:.56} 50%{opacity:1} }
.skeleton { background: var(--bg-inset); border-radius: var(--radius-md); animation: dp-shimmer 1.4s ease-in-out infinite; }
@keyframes dp-fade-up { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
.fade-up { animation: dp-fade-up .18s ease both; }
@keyframes dp-drawer-in { from{transform:translateX(100%)} to{transform:none} }
.drawer-in { animation: dp-drawer-in .2s ease both; }
@keyframes dp-drawer-in-left { from{transform:translateX(-100%)} to{transform:none} }
.drawer-in-left { animation: dp-drawer-in-left .2s ease both; }
@keyframes dp-pop { from{opacity:0;transform:translateY(-2px)} to{opacity:1;transform:none} }
.pop-in { animation: dp-pop .12s ease both; }

.recharts-cartesian-axis-tick text { font-family: var(--font-sans); font-size: 12px; fill: var(--ch-axis); }
.recharts-cartesian-grid line { stroke: var(--ch-grid); }
.recharts-tooltip-cursor { stroke: var(--border-strong); }

.filter-scroll { overscroll-behavior-x: contain; scroll-padding-inline: 12px; }
.filter-scroll > * { scroll-margin-inline: 8px; }

@media (max-width: 767px) {
  .page-shell { padding: 16px 14px 92px; }
  .filter-scroll button,
  .filter-scroll select { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {

}

  }
}
@media (forced-colors: active) {
  *:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; box-shadow: none; }
  .surface-card { border: 1px solid CanvasText; box-shadow: none; }
}
@media print {
  body { background:#fff; color:#111; }
  .no-print { display:none!important; }
  .print-block { break-inside:avoid; }
  .page-shell { max-width:none; padding:0; }
}

/* User-controlled accessibility preferences */
:root[data-font-scale='110'] { font-size: 110%; }

  --text-3: #d5d3e3;
}
